services:
  web:
    build: ./docker
    ports:
      - "127.0.0.1:8080:80"
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: beadando
      MYSQL_USER: beadando
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Hozz letre .env fajlt}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Hozz letre .env fajlt}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u beadando -D beadando -e 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
  phpmyadmin:
    image: phpmyadmin:5.2-apache
    ports:
      - "127.0.0.1:8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    depends_on:
      db:
        condition: service_healthy
volumes:
  mysql-data:
